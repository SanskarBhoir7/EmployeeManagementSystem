# Application Configuration
spring.application.name=employee-management-system
server.port=8081

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Sb#031106
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable static resource handling for frontend
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.example.employee=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT Configuration (Supports override via environment variables JWT_SECRET & JWT_EXPIRATION_MS)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Employee Validation Rules
app.employee.min-age=18

# Application Configuration
spring.application.name=employee-management-system
server.port=${PORT:8081}

# MySQL Database Configuration. Supply DB_NAME, DB_USERNAME, and DB_PASSWORD explicitly.
# Never create a missing schema automatically; Flyway manages only an explicitly provisioned database.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_v2
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Enable static resource handling for frontend
spring.web.resources.static-locations=classpath:/static/

# Expose only the basic health endpoint; hide component names and details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Logging
logging.level.com.example.employee=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT Configuration (Supports override via environment variables JWT_SECRET & JWT_EXPIRATION_MS)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Employee Validation Rules
app.employee.min-age=18

# Employee import limits: enforce at the servlet boundary and in the import service.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.employee.import.max-file-size=5242880

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS Pro | Sign In</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: #ffffff;
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            max-width: 460px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .login-header {
            background: #0f172a;
            color: #ffffff;
            padding: 2.25rem 2rem 1.75rem;
            text-align: center;
        }
        .login-brand-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 0.75rem;
            color: #ffffff;
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
        }
        .login-body {
            padding: 2rem;
        }
        .demo-chip {
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.8rem;
            padding: 0.4rem 0.65rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
        }
        .demo-chip:hover {
            background: #eef2ff;
            border-color: #4f46e5;
            color: #4f46e5;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="login-brand-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">EMS Pro</h3>
            <p class="text-light opacity-75 small mb-0">Employee Database & Management System</p>
        </div>

        <div class="login-body">
            <!-- Alert message for login status -->
            <div id="loginAlert" class="alert d-none py-2 px-3 small" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="usernameInput" class="form-label small fw-semibold text-secondary">Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control border-start-0" id="usernameInput" placeholder="e.g. admin or admin@example.com" required autocomplete="username">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="passwordInput" class="form-label small fw-semibold text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control border-start-0" id="passwordInput" placeholder="Enter password" required autocomplete="current-password">
                        <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" title="Show/Hide Password">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold" id="submitLoginBtn">
                    <span id="loginBtnSpinner" class="spinner-border spinner-border-sm me-1 d-none"></span>
                    <span id="loginBtnText"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</span>
                </button>
            </form>

            <hr class="my-4">

            <!-- Quick Demo Credentials for Viva / Testing -->
            <div class="demo-section">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <span class="text-muted small fw-semibold">Quick Demo Logins:</span>
                    <span class="badge bg-light text-secondary border">BCrypt Secured</span>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="btn demo-chip" onclick="fillCredentials('admin', 'Admin@123')">
                        <i class="bi bi-shield-fill text-danger me-1"></i> <strong>Admin</strong> (admin)
                    </button>
                    <button type="button" class="btn demo-chip" onclick="fillCredentials('hrmanager', 'Hr@123')">
                        <i class="bi bi-person-badge-fill text-primary me-1"></i> <strong>HR</strong> (hrmanager)
                    </button>
                    <button type="button" class="btn demo-chip" onclick="fillCredentials('rahul.s', 'Emp@123')">
                        <i class="bi bi-person-circle text-success me-1"></i> <strong>Employee</strong> (rahul.s)
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-light px-4 py-3 text-center border-top">
            <small class="text-muted">Spring Security &bull; JWT Bearer Auth &bull; Role-Based Access Control</small>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const AUTH_API_URL = (window.location.port === '8081' || window.location.port === '8080')
            ? `${window.location.origin}/api/auth/login`
            : 'http://localhost:8081/api/auth/login';

        // Check URL params for messages (e.g. logout or session expired)
        const urlParams = new URLSearchParams(window.location.search);
        const alertBox = document.getElementById('loginAlert');

        if (urlParams.get('session_expired') === 'true') {
            showAlert('Your session has expired. Please sign in again.', 'warning');
        } else if (urlParams.get('logout') === 'true') {
            showAlert('You have been logged out successfully.', 'info');
        }

        // Toggle password visibility
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passInput = document.getElementById('passwordInput');
        const passIcon = document.getElementById('togglePasswordIcon');
        toggleBtn.addEventListener('click', () => {
            const isPassword = passInput.type === 'password';
            passInput.type = isPassword ? 'text' : 'password';
            passIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });

        // Demo quick fill helper
        function fillCredentials(username, password) {
            document.getElementById('usernameInput').value = username;
            document.getElementById('passwordInput').value = password;
            document.getElementById('submitLoginBtn').focus();
        }

        // Form submit
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            if (!username || !password) {
                showAlert('Please provide both username and password.', 'danger');
                return;
            }

            const btn = document.getElementById('submitLoginBtn');
            const spinner = document.getElementById('loginBtnSpinner');
            const btnText = document.getElementById('loginBtnText');
            btn.disabled = true;
            spinner.classList.remove('d-none');
            btnText.textContent = ' Authenticating...';

            try {
                const response = await fetch(AUTH_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Authentication failed. Please verify credentials.');
                }

                // Save auth session
                localStorage.setItem('ems_auth_token', data.token);
                localStorage.setItem('ems_user', JSON.stringify({
                    id: data.id,
                    username: data.username,
                    email: data.email,
                    role: data.role,
                    employeeId: data.employeeId
                }));
                // Keep backward compatibility for existing FA-I role badge
                localStorage.setItem('ems_role', data.role);

                showAlert('Sign in successful! Redirecting...', 'success');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 700);

            } catch (err) {
                showAlert(err.message || 'Invalid username or password.', 'danger');
                btn.disabled = false;
                spinner.classList.add('d-none');
                btnText.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
            }
        });

        function showAlert(msg, type) {
            alertBox.className = `alert alert-${type} py-2 px-3 small`;
            alertBox.textContent = msg;
            alertBox.classList.remove('d-none');
        }
    </script>
</body>
</html>
